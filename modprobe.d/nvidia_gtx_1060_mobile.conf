## NVIDIA GP106M / GeForce GTX 1060 Mobile setup.

# nvidia options
options nvidia NVreg_EnableGpuFirmware=0
options nvidia NVreg_DynamicPowerManagement=0x02
# 3 GB in KB, up to 6 GB available
options nvidia NVreg_MemoryPoolSize=3072000
options nvidia NVreg_EnablePCIeGen3=1
options nvidia NVreg_EnableResizableBar=1
# Preserve video memory on suspend/resume
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var

# nvidia_drm options
options nvidia_drm modeset=1
options nvidia_drm fbdev=1

# nvidia_uvm options
options nvidia_uvm uvm_global_oversubscription=1
options nvidia_uvm uvm_perf_prefetch_enable=1
options nvidia_uvm uvm_perf_thrashing_enable=1
options nvidia_uvm uvm_leak_checker=1
options nvidia_uvm uvm_enable_debug_procfs=1
